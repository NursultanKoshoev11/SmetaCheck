name: smetacheck

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    restart: unless-stopped
    expose: ["8080"]
    volumes:
      - uploads:/var/lib/smetacheck/uploads
      - reports:/var/lib/smetacheck/reports
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    restart: unless-stopped
    volumes:
      - uploads:/var/lib/smetacheck/uploads
      - reports:/var/lib/smetacheck/reports
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    expose: ["3000"]
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.8-alpine
    env_file: .env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [edge]
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
    internal: true
  edge:

volumes:
  pgdata:
  redisdata:
  uploads:
  reports:
  caddydata:
  caddyconfig:
