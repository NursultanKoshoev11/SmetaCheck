name: smetacheck

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-5}

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  APP_NAME: ${APP_NAME:-SmetaCheck KG}
  HTTP_ADDR: ${HTTP_ADDR:-:8080}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:?API_PUBLIC_BASE_URL is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
  DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-1}
  DATABASE_MAX_CONN_LIFETIME: ${DATABASE_MAX_CONN_LIFETIME:-1h}
  DATABASE_MAX_CONN_IDLE_TIME: ${DATABASE_MAX_CONN_IDLE_TIME:-15m}
  DATABASE_HEALTH_CHECK_PERIOD: ${DATABASE_HEALTH_CHECK_PERIOD:-30s}
  REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-15s}
  SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SmetaCheck KG}
  OAUTH_HTTP_TIMEOUT: ${OAUTH_HTTP_TIMEOUT:-15s}
  OAUTH_STATE_TTL: ${OAUTH_STATE_TTL:-10m}
  AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
  GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
  GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
  GOOGLE_OIDC_REDIRECT_URL: ${GOOGLE_OIDC_REDIRECT_URL:-}
  AUTH_TELEGRAM_ENABLED: ${AUTH_TELEGRAM_ENABLED:-false}
  TELEGRAM_OIDC_ISSUER: ${TELEGRAM_OIDC_ISSUER:-https://oauth.telegram.org}
  TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
  TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
  TELEGRAM_OIDC_REDIRECT_URL: ${TELEGRAM_OIDC_REDIRECT_URL:-}
  UPLOAD_DIR: ${UPLOAD_DIR:-/var/lib/smetacheck/uploads}
  REPORT_DIR: ${REPORT_DIR:-/var/lib/smetacheck/reports}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  MAX_BATCH_FILES: ${MAX_BATCH_FILES:-10}
  MAX_BATCH_TOTAL_MB: ${MAX_BATCH_TOTAL_MB:-200}
  MAX_COMPARE_TOTAL_MB: ${MAX_COMPARE_TOTAL_MB:-60}
  MULTIPART_MEMORY_MB: ${MULTIPART_MEMORY_MB:-32}
  BATCH_FILE_RETENTION_DAYS: ${BATCH_FILE_RETENTION_DAYS:-30}
  SERVER_READ_HEADER_TIMEOUT: ${SERVER_READ_HEADER_TIMEOUT:-5s}
  SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT:-60s}
  SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-60s}
  SERVER_IDLE_TIMEOUT: ${SERVER_IDLE_TIMEOUT:-60s}
  SERVER_SHUTDOWN_TIMEOUT: ${SERVER_SHUTDOWN_TIMEOUT:-20s}
  AI_PROVIDER: ${AI_PROVIDER:-rules}
  AI_ALLOW_REQUEST_PROVIDER_OVERRIDE: ${AI_ALLOW_REQUEST_PROVIDER_OVERRIDE:-false}
  AI_TIMEOUT: ${AI_TIMEOUT:-45s}
  AI_HTTP_MAX_ATTEMPTS: ${AI_HTTP_MAX_ATTEMPTS:-3}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-3000}
  AI_ROWS_PER_CHUNK: ${AI_ROWS_PER_CHUNK:-250}
  AI_MAX_RAW_FILE_MB: ${AI_MAX_RAW_FILE_MB:-20}
  AI_ALLOWED_OPENAI_MODELS: ${AI_ALLOWED_OPENAI_MODELS:-gpt-4.1-mini}
  AI_ALLOWED_GEMINI_MODELS: ${AI_ALLOWED_GEMINI_MODELS:-gemini-2.5-flash}
  AI_ALLOWED_ANTHROPIC_MODELS: ${AI_ALLOWED_ANTHROPIC_MODELS:-claude-sonnet-4-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
  ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}

x-worker-environment: &worker-environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_MAX_CONNS: ${WORKER_DATABASE_MAX_CONNS:-6}
  DATABASE_MIN_CONNS: ${WORKER_DATABASE_MIN_CONNS:-1}
  DATABASE_MAX_CONN_LIFETIME: ${DATABASE_MAX_CONN_LIFETIME:-1h}
  DATABASE_MAX_CONN_IDLE_TIME: ${DATABASE_MAX_CONN_IDLE_TIME:-15m}
  DATABASE_HEALTH_CHECK_PERIOD: ${DATABASE_HEALTH_CHECK_PERIOD:-30s}
  REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
  UPLOAD_DIR: ${UPLOAD_DIR:-/var/lib/smetacheck/uploads}
  REPORT_DIR: ${REPORT_DIR:-/var/lib/smetacheck/reports}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  MAX_BATCH_FILES: ${MAX_BATCH_FILES:-10}
  BATCH_FILE_RETENTION_DAYS: ${BATCH_FILE_RETENTION_DAYS:-30}
  BATCH_CLEANUP_INTERVAL: ${BATCH_CLEANUP_INTERVAL:-6h}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
  AI_PROVIDER: ${AI_PROVIDER:-rules}
  AI_ALLOW_REQUEST_PROVIDER_OVERRIDE: ${AI_ALLOW_REQUEST_PROVIDER_OVERRIDE:-false}
  AI_TIMEOUT: ${AI_TIMEOUT:-45s}
  AI_HTTP_MAX_ATTEMPTS: ${AI_HTTP_MAX_ATTEMPTS:-3}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-3000}
  AI_ROWS_PER_CHUNK: ${AI_ROWS_PER_CHUNK:-250}
  AI_MAX_RAW_FILE_MB: ${AI_MAX_RAW_FILE_MB:-20}
  AI_BATCH_MAX_ATTEMPTS: ${AI_BATCH_MAX_ATTEMPTS:-3}
  AI_BATCH_LOCK_TIMEOUT: ${AI_BATCH_LOCK_TIMEOUT:-15m}
  AI_BATCH_HEARTBEAT_INTERVAL: ${AI_BATCH_HEARTBEAT_INTERVAL:-30s}
  AI_BATCH_TIMEOUT: ${AI_BATCH_TIMEOUT:-30m}
  AI_ALLOWED_OPENAI_MODELS: ${AI_ALLOWED_OPENAI_MODELS:-gpt-4.1-mini}
  AI_ALLOWED_GEMINI_MODELS: ${AI_ALLOWED_GEMINI_MODELS:-gemini-2.5-flash}
  AI_ALLOWED_ANTHROPIC_MODELS: ${AI_ALLOWED_ANTHROPIC_MODELS:-claude-sonnet-4-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
  ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *api-environment
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose: ["8080"]
    volumes:
      - uploads:/var/lib/smetacheck/uploads
      - reports:/var/lib/smetacheck/reports
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.5}
    pids_limit: ${API_PIDS_LIMIT:-256}
    logging: *default-logging
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *worker-environment
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    volumes:
      - uploads:/var/lib/smetacheck/uploads
      - reports:/var/lib/smetacheck/reports
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: ${WORKER_MEMORY_LIMIT:-1536m}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-384}
    logging: *default-logging
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.production
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?NEXT_PUBLIC_API_BASE is required}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose: ["3000"]
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-256}
    logging: *default-logging
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.8-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    pids_limit: ${CADDY_PIDS_LIMIT:-128}
    logging: *default-logging
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
    internal: true
  edge:

volumes:
  pgdata:
  redisdata:
  uploads:
  reports:
  caddydata:
  caddyconfig:
