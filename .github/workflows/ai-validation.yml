name: AI Batch Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: AI and batch backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Report formatting debt
        shell: bash
        run: |
          files="$(gofmt -l . 2>&1 || true)"
          if [ -n "$files" ]; then
            echo "::warning::Go files still requiring formatting:"
            printf '%s\n' "$files"
          fi
      - name: Verify module files
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          diff -u /tmp/go.mod.before go.mod
          diff -u /tmp/go.sum.before go.sum
      - name: Vet
        run: go vet ./...
      - name: Test AI, batch and backend packages
        run: go test ./...
      - name: Build services
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-api ./cmd/api
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-worker ./cmd/worker
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-bot ./cmd/bot
