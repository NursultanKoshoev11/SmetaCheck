name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Build worker
        run: go build ./cmd/worker

      - name: Build bot
        run: go build ./cmd/bot

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api .

      - name: Build worker image
        run: docker build -f Dockerfile.worker .

      - name: Build bot image
        run: docker build -f Dockerfile.bot .
