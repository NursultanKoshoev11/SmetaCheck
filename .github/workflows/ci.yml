name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Verify module files
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          diff -u /tmp/go.mod.before go.mod
          diff -u /tmp/go.sum.before go.sum
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build services
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-api ./cmd/api
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-worker ./cmd/worker
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-bot ./cmd/bot

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build

  containers:
    name: Production configuration and images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare validation environment
        run: cp .env.production.example .env
      - name: Validate production Compose
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build API image
        run: docker build --pull -f Dockerfile.api -t smetacheck-api:ci .
      - name: Build worker image
        run: docker build --pull -f Dockerfile.worker -t smetacheck-worker:ci .
      - name: Build bot image
        run: docker build --pull -f Dockerfile.bot -t smetacheck-bot:ci .
      - name: Build frontend image
        run: docker build --pull --build-arg NEXT_PUBLIC_API_BASE=https://api.example.com -f Dockerfile.frontend -t smetacheck-frontend:ci .
