name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Backend quality and builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run backend diagnostics
        shell: bash
        run: |
          set +e
          gofmt -l . > gofmt.log 2>&1
          go vet ./... > vet.log 2>&1
          echo $? > vet.status
          go test -race ./... > race.log 2>&1
          echo $? > race.status
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-api ./cmd/api > build-api.log 2>&1
          echo $? > build-api.status
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-worker ./cmd/worker > build-worker.log 2>&1
          echo $? > build-worker.status
          CGO_ENABLED=0 go build -trimpath -o /tmp/smetacheck-bot ./cmd/bot > build-bot.log 2>&1
          echo $? > build-bot.status
          exit 0
      - name: Upload backend diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            gofmt.log
            vet.log
            race.log
            build-*.log
            *.status
      - name: Enforce backend gate
        shell: bash
        run: |
          test "$(cat vet.status)" = "0"
          test "$(cat race.status)" = "0"
          test "$(cat build-api.status)" = "0"
          test "$(cat build-worker.status)" = "0"
          test "$(cat build-bot.status)" = "0"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Production configuration and images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare validation environment
        run: cp .env.production.example .env
      - name: Validate production Compose
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Run container diagnostics
        shell: bash
        run: |
          set +e
          docker build --pull -f Dockerfile.api -t smetacheck-api:ci . > docker-api.log 2>&1
          echo $? > docker-api.status
          docker build --pull -f Dockerfile.worker -t smetacheck-worker:ci . > docker-worker.log 2>&1
          echo $? > docker-worker.status
          docker build --pull -f Dockerfile.bot -t smetacheck-bot:ci . > docker-bot.log 2>&1
          echo $? > docker-bot.status
          docker build --pull --build-arg NEXT_PUBLIC_API_BASE=https://api.example.com -f Dockerfile.frontend -t smetacheck-frontend:ci . > docker-frontend.log 2>&1
          echo $? > docker-frontend.status
          exit 0
      - name: Upload container diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: container-diagnostics
          path: |
            docker-*.log
            docker-*.status
      - name: Enforce container gate
        shell: bash
        run: |
          test "$(cat docker-api.status)" = "0"
          test "$(cat docker-worker.status)" = "0"
          test "$(cat docker-bot.status)" = "0"
          test "$(cat docker-frontend.status)" = "0"
