# SmetaCheck KG production reverse proxy
# Replace domain names before use.

server {
    listen 80;
    server_name smetacheck.kg www.smetacheck.kg app.smetacheck.kg api.smetacheck.kg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.smetacheck.kg;

    ssl_certificate /etc/letsencrypt/live/api.smetacheck.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.smetacheck.kg/privkey.pem;

    client_max_body_size 25m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name smetacheck.kg www.smetacheck.kg app.smetacheck.kg;

